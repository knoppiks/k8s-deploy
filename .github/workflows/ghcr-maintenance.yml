name: GHCR Maintenance

on:
  schedule:
  - cron: '30 1 * * *'
  workflow_dispatch:

# Declare default permissions as read-only.
permissions: read-all

jobs:
  cleanup:
    runs-on: ubuntu-26.04
    concurrency:
      group: ghcr-cleanup
    permissions:
      packages: write
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit

    # Consumers pin release tags by digest. Keep superseded digests pullable
    # for a while after the tag moves. Age counts from the build, not from
    # the tag move; the weekly rebuild keeps tags younger than 7 days.
    - name: Cleanup Untagged Images >30d
      uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
      with:
        delete-untagged: true
        delete-ghost-images: true
        delete-partial-images: true
        delete-orphaned-images: true
        older-than: 30 days

    - name: Cleanup PR Images >7d
      uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
      with:
        use-regex: true
        exclude-tags: '^\d+\.\d+\.\d+$'
        delete-tags: '^(v?\d+\.\d+\.\d+-(pr\.)?\d+|pr-\d+)$'
        older-than: 7 days
